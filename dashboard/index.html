<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink Dashboard | Real-time Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="../img/favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Inicijalizacija LifeLink Cloud sistema...</p>
    </div>

    <header>
        <div class="logo-section">
            <a href="../index.html" class="logo-link">
                <h1>LIFE<span>LINK</span></h1>
            </a>
        </div>
        
        <div class="nav-container">
            <div class="dashboard-label">DASHBOARD</div>
            
            <div class="nav-pill pill-monitor">
                <i class="fas fa-desktop"></i> Live Monitor
            </div>
            
            <a href="../izvestaj.html" class="nav-pill pill-company">
                <i class="fas fa-file-alt"></i> Učenička kompanija
            </a>
            
            <a href="../LifeLink-narukvica za pomoć najugroženijim pacijentima.pdf" target="_blank" class="nav-pill pill-cup">
                <i class="fas fa-trophy"></i> Galaksija kup
            </a>

            <div id="connection-status" class="status-badge status-offline">Provera...</div>
        </div>
    </header>

    <main>
        <div id="devices-container" class="devices-grid">
            <!-- Kartice uređaja će biti ubačene ovde putem JS -->
        </div>
        
        <div id="no-devices" style="display: none; text-align: center; margin-top: 5rem;">
            <h2 style="color: var(--text-secondary);">Nema registrovanih narukvica</h2>
            <p style="color: var(--text-secondary); opacity: 0.6;">Povežite narukvicu putem mobilne aplikacije da biste videli podatke.</p>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
